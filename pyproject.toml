[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-tensorflow"
version = "1.1.1"
description = "Federated Learning with Tensorflow/Keras and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "tensorflow>=2.9.1, != 2.11.1 ; (platform_machine == \"x86_64\" or platform_machine == \"aarch64\")",
    "tensorflow-macos>=2.9.1, != 2.11.1 ; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
    "joblib==1.5.3",
    "keras==3.14.1",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "opentelemetry-api==1.42.0",
    "opentelemetry-proto==1.42.0",
    "opentelemetry-sdk==1.42.0",
    "opentelemetry-semantic-conventions==0.63b0",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "tensorflow==2.20.0"
]
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.29.0"

[tool.flwr.app.components]
serverapp = "src.federated.server:app"
clientapp = "src.federated.client:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
batch-size = 32
learning-rate = 0.005
fraction-train = 0.5
verbose = false